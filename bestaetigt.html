<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Rebricked</title>
<!-- Rückrufseite der Vorlage „Rebricked Bestätigung“ (_spec/email_konto.md Anhang C): statisch, ohne fremde Skripte, ohne Statistik,
     wertet den Query-String nicht aus. Nur über HTTPS ausliefern. -->
<style>
  :root { --hg: #0d1a2b; --kasten: #142a44; --text: #e8eef5; --orange: #f49719; --grau: #9fb0c3; }
  html, body { margin: 0; background: var(--hg); color: var(--text); font-family: system-ui, "Segoe UI", Arial, sans-serif; }
  main { max-width: 560px; margin: 12vh auto 0; padding: 0 16px; }
  .kasten { background: var(--kasten); border: 1px solid #22426a; border-radius: 10px; padding: 28px 24px; }
  h1 { color: var(--orange); font-size: 1.6rem; margin: 0 0 18px; letter-spacing: .02em; }
  p { line-height: 1.5; margin: 0 0 12px; }
  .en { color: var(--grau); border-top: 1px solid #22426a; padding-top: 12px; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <div class="kasten">
    <h1>Rebricked</h1>
    <p>Danke! Deine E-Mail-Adresse ist bestätigt. Du kannst dieses Fenster schließen.</p>
    <p class="en" lang="en">Thank you! Your e-mail address is confirmed. You can close this window.</p>
  </div>
</main>
</body>
</html>
